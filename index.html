<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asset Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      max-width: 480px;
    }
    .guide {
      margin-top: 15px;
      font-size: 14px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="reader"></div>
  <div class="guide">Align the barcode in the frame</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Limit detection specifically to Code 128
    const scanner = new Html5Qrcode("reader", {
      formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ],
      verbose: false
    });

    // Dynamic scanning box: 85% width, slim height tailored for 1D barcodes
    const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
      return {
        width: Math.floor(viewfinderWidth * 0.85),
        height: Math.floor(viewfinderHeight * 0.35)
      };
    };

    scanner.start(
      { facingMode: "environment" }, // Exactly 1 key here
      {
        fps: 20,
        qrbox: qrboxFunction,
        videoConstraints: {
          facingMode: "environment",
          width: { ideal: 1920, min: 1280 },
          height: { ideal: 1080, min: 720 }
        }
      },
      (decodedText) => {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        scanner.stop().then(() => {
          tg.sendData(decodedText.trim());
        });
      },
      (errorMessage) => {}
    ).catch(err => {
      document.body.innerHTML = `<div style="padding:20px;text-align:center;">Camera error: ${err}</div>`;
    });
  </script>
</body>
</html>
