<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asset Tag Scanner</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Fast camera barcode reader -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      max-width: 480px;
    }
    .guide {
      margin-top: 18px;
      font-size: 15px;
      color: #bbb;
      text-align: center;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div id="reader"></div>
  <div class="guide">Point camera at the Code 128 barcode</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      {
        fps: 20,
        qrbox: { width: 300, height: 120 }, // Wide box tailored for horizontal 1D barcodes
        formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ]
      },
      (decodedText) => {
        // Haptic buzz on phone when barcode is detected
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        scanner.stop().then(() => {
          // Closes popup and sends the tag string directly into the Telegram chat
          tg.sendData(decodedText.trim());
        });
      },
      (errorMessage) => {
        // Live search in progress
      }
    ).catch(err => {
      document.body.innerHTML = `<div style="padding:20px;text-align:center;">Camera error: ${err}</div>`;
    });
  </script>
</body>
</html>
