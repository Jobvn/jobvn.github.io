<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asset Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      max-width: 500px;
    }
    .guide {
      margin-top: 15px;
      font-size: 14px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="reader"></div>
  <div class="guide">Align the barcode anywhere in the box</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const scanner = new Html5Qrcode("reader");

    // Dynamic scanning box: 85% width, slim height for 1D barcodes
    const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
      return {
        width: Math.floor(viewfinderWidth * 0.85),
        height: Math.floor(viewfinderHeight * 0.35)
      };
    };

    scanner.start(
      {
        facingMode: "environment",
        // Force high resolution and continuous autofocus
        width: { ideal: 1920, min: 1280 },
        height: { ideal: 1080, min: 720 },
        focusMode: "continuous"
      },
      {
        fps: 20,
        qrbox: qrboxFunction,
        formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ]
      },
      (decodedText) => {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        scanner.stop().then(() => {
          tg.sendData(decodedText.trim());
        });
      },
      (errorMessage) => {}
    ).then(() => {
      // Apply 2x digital/optical zoom if the device camera supports it
      const video = document.querySelector("#reader video");
      if (video && video.srcObject) {
        const [track] = video.srcObject.getVideoTracks();
        if (track && track.getCapabilities) {
          const caps = track.getCapabilities();
          if (caps.zoom) {
            const targetZoom = Math.min(2.0, caps.zoom.max);
            track.applyConstraints({ advanced: [{ zoom: targetZoom }] }).catch(() => {});
          }
        }
      }
    }).catch(err => {
      document.body.innerHTML = `<div style="padding:20px;text-align:center;">Camera error: ${err}</div>`;
    });
  </script>
</body>
</html>
